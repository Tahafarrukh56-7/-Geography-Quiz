<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geography Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="quiz-container">

        <h1>🌍 Geography Quiz</h1>

        <div id="quiz-box">

            <div class="quiz-info">
                <span id="question-number">
                    Question 1 of 10
                </span>

                <span id="score">
                    Score: 0
                </span>
            </div>

            <h2 id="question">
                Question goes here
            </h2>

            <div id="answers"></div>

            <button id="next-btn">
                Next Question
            </button>

        </div>

        <div id="result-box" class="hidden">

            <h2>🎉 Quiz Finished!</h2>

            <p id="final-score"></p>

            <p id="message"></p>

            <button id="restart-btn">
                Play Again
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
